name: Build and publish routing

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths: ['build.py', 'test_build.py', '.github/workflows/build.yml']
  pull_request:
    paths: ['build.py', 'test_build.py', '.github/workflows/build.yml']

permissions:
  contents: read

concurrency:
  group: routing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 120 \
            https://github.com/SagerNet/sing-box/releases/download/v1.12.12/sing-box-1.12.12-linux-amd64.tar.gz \
            -o "$RUNNER_TEMP/sing-box.tar.gz"
          echo "7c103cb2f9a7dc54cb82962043596718ed27989a478d6405f0939a9b775f889f  $RUNNER_TEMP/sing-box.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/sing-box.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/sing-box-1.12.12-linux-amd64" >> "$GITHUB_PATH"
      - name: Test conversion semantics
        run: python3 -m unittest -v
      - name: Download, convert, compile and check profiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 build.py --repository "$GITHUB_REPOSITORY"
      - name: Publish atomically to rules branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/publish"
          cd "$RUNNER_TEMP/publish"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          existing=$(git ls-remote --heads origin refs/heads/rules)
          if [ -n "$existing" ]; then
            git fetch --depth=1 origin rules
            git checkout -b rules FETCH_HEAD
          else
            git checkout --orphan rules
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a "$GITHUB_WORKSPACE/dist/." .
          git add --all
          git commit -m "Build rules from ${GITHUB_SHA} (run ${GITHUB_RUN_ID})"
          git push origin HEAD:rules
          echo "Published commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify public HTTPS artifacts
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/verify"
          cd "$RUNNER_TEMP/verify"
          while read -r expected filename; do
            curl --fail --location --retry 4 --retry-all-errors --retry-delay 10 --max-time 120 \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/rules/${filename}?run=${GITHUB_RUN_ID}" -o "$filename"
            echo "$expected  $filename" | sha256sum -c -
          done < "$GITHUB_WORKSPACE/dist/SHA256SUMS"
          echo 'PASS: published files downloaded over public HTTPS and SHA-256 verified.' >> "$GITHUB_STEP_SUMMARY"
